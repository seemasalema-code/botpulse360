name: Validate and publish dashboard workbook

on:
  push:
    paths:
      - scripts/fetch_google_snapshot.py
      - scripts/build_snapshot.py
      - .github/workflows/publish-workbook.yml
  workflow_dispatch:
  schedule:
    # GitHub's minimum scheduled interval. The job commits only when data changes.
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: dashboard-workbook-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check openpyxl==3.1.5
      - name: Refresh the workbook from Google Sheets
        run: python scripts/fetch_google_snapshot.py --output source/dashboard-source.xlsx
      - name: Validate workbook and build atomic snapshot
        run: python scripts/build_snapshot.py source/dashboard-source.xlsx --output data.js
      - name: Publish snapshot
        run: |
          git config user.name "dashboard-publisher"
          git config user.email "dashboard-publisher@users.noreply.github.com"
          # Keep every browser-facing feed in the same commit. The dashboard
          # prefers data/latest.json + data/tabs/*, so publishing only data.js
          # leaves the live UI pinned to an older manifest.
          # The downloaded workbook is an ephemeral build input. Do not
          # republish the raw spreadsheet into the public repository.
          git add data.js snapshot-report.json data/latest.json data/tabs data/partitions data/archive
          git diff --cached --quiet && exit 0
          git commit -m "Publish validated dashboard snapshot"
          git push
