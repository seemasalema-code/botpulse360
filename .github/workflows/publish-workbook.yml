name: Validate and publish dashboard workbook

on:
  push:
    paths:
      - scripts/fetch_google_snapshot.py
      - scripts/build_snapshot.py
      - .github/workflows/publish-workbook.yml
  workflow_dispatch:
  schedule:
    # 15:00 Asia/Kolkata = 09:30 UTC, every Wednesday and Friday.
    - cron: "30 9 * * 3,5"

permissions:
  contents: write

concurrency:
  group: dashboard-workbook-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check openpyxl==3.1.5
      - name: Refresh the workbook from Google Sheets
        run: python scripts/fetch_google_snapshot.py --output source/dashboard-source.xlsx
      - name: Validate workbook and build atomic snapshot
        run: python scripts/build_snapshot.py source/dashboard-source.xlsx --output data.js
      - name: Publish snapshot
        run: |
          git config user.name "dashboard-publisher"
          git config user.email "dashboard-publisher@users.noreply.github.com"
          git add source/dashboard-source.xlsx data.js snapshot-report.json data/partitions data/archive
          git diff --cached --quiet && exit 0
          git commit -m "Publish validated dashboard snapshot"
          git push
