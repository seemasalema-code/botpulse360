name: Refresh dashboard data

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-dashboard-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Read all dashboard source sheets
        run: node scripts/sync-sheet.mjs
      - name: Publish refreshed snapshot
        run: |
          if git diff --quiet -- data.js; then
            echo "No source changes detected."
            exit 0
          fi
          git config user.name "botpulse360-data-bot"
          git config user.email "304962156+seemasalema-code@users.noreply.github.com"
          git add data.js
          git commit -m "Refresh dashboard data"
          git push
